name: Update Sermon Video

on:
  workflow_dispatch:
    inputs:
      ko_url:
        description: '한국어 예배 영상 YouTube URL (watch / youtu.be / live / embed 형식 모두 가능)'
        required: false
        type: string
      ja_url:
        description: '일본어 예배 영상 YouTube URL (watch / youtu.be / live / embed 형식 모두 가능)'
        required: false
        type: string

permissions:
  contents: write
  # GITHUB_TOKEN 으로 만든 push 는 push 이벤트를 발생시키지 않아 deploy 워크플로우가
  # 자동으로 돌지 않는다. 그래서 배포를 직접 dispatch 하기 위해 actions: write 가 필요하다.
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate inputs
        env:
          KO_URL: ${{ inputs.ko_url }}
          JA_URL: ${{ inputs.ja_url }}
        run: |
          if [ -z "${KO_URL// }" ] && [ -z "${JA_URL// }" ]; then
            echo "::error::ko_url 과 ja_url 중 최소 하나는 입력해야 합니다."
            exit 1
          fi

      - name: Replace embed URLs
        id: replace
        env:
          KO_URL: ${{ inputs.ko_url }}
          JA_URL: ${{ inputs.ja_url }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import sys
          from urllib.parse import parse_qs, urlparse

          TARGETS = {
              "ko": ("KO_URL", "web/src/components/ko/_SermonVideoKorean.astro"),
              "ja": ("JA_URL", "web/src/components/ja/_SermonVideoJapanese.astro"),
          }
          SRC_PATTERN = re.compile(r'src="(https://www\.youtube\.com/embed/[^"]*)"')
          VIDEO_ID = re.compile(r'^[A-Za-z0-9_-]{11}$')

          def to_embed_url(raw):
              """다양한 형태의 YouTube 링크를 (video_id, embed URL) 로 정규화한다."""
              url = raw.strip()
              if VIDEO_ID.match(url):
                  return url, f"https://www.youtube.com/embed/{url}"

              if not url.startswith(("http://", "https://")):
                  url = "https://" + url

              parsed = urlparse(url)
              host = parsed.netloc.lower().removeprefix("www.")
              path = parsed.path.strip("/").split("/")
              query = parse_qs(parsed.query)

              if host in ("youtu.be",):
                  video_id = path[0] if path and path[0] else ""
              elif host in ("youtube.com", "m.youtube.com", "youtube-nocookie.com"):
                  if path and path[0] in ("embed", "live", "shorts", "v") and len(path) > 1:
                      video_id = path[1]
                  else:
                      video_id = query.get("v", [""])[0]
              else:
                  raise ValueError(f"YouTube URL 이 아닙니다: {raw}")

              if not VIDEO_ID.match(video_id):
                  raise ValueError(f"video id 를 추출하지 못했습니다: {raw}")

              embed = f"https://www.youtube.com/embed/{video_id}"
              si = query.get("si", [""])[0]
              if si:
                  embed += f"?si={si}"
              return video_id, embed

          changed = []
          skipped = []
          errors = []

          for lang, (env_key, rel_path) in TARGETS.items():
              raw = os.environ.get(env_key, "").strip()
              if not raw:
                  continue

              try:
                  video_id, embed = to_embed_url(raw)
              except ValueError as exc:
                  errors.append(str(exc))
                  continue

              path = pathlib.Path(rel_path)
              original = path.read_text(encoding="utf-8")
              match = SRC_PATTERN.search(original)
              if not match:
                  errors.append(f"{rel_path} 에서 embed src 를 찾지 못했습니다.")
                  continue

              # si 는 공유할 때마다 새로 발급되는 추적 파라미터라 video id 로만 비교한다.
              current = match.group(1)
              try:
                  current_id, _ = to_embed_url(current)
              except ValueError:
                  current_id = None

              if current_id == video_id:
                  skipped.append(f"{lang}:{current}")
                  print(f"::notice::{rel_path} 는 이미 같은 영상({video_id})입니다. 건너뜁니다.")
                  continue

              updated = original[:match.start(1)] + embed + original[match.end(1):]
              path.write_text(updated, encoding="utf-8")
              changed.append(f"{lang}:{embed}")
              print(f"::notice::{rel_path} -> {embed}")

          if errors:
              for message in errors:
                  print(f"::error::{message}")
              sys.exit(1)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"changed={' '.join(changed)}\n")
              out.write(f"skipped={' '.join(skipped)}\n")
              out.write(f"has_changes={'true' if changed else 'false'}\n")
          PY

      - name: Commit and deploy
        if: steps.replace.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED: ${{ steps.replace.outputs.changed }}
        run: |
          DATE=$(TZ=Asia/Tokyo date +'%Y.%m.%d')
          TITLE="chore: update worship service video - ${DATE}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/components
          git commit -m "$TITLE"
          # actions/checkout 은 detached HEAD 로 체크아웃하므로 HEAD: 형태로 푸시한다.
          git push origin "HEAD:${GITHUB_REF_NAME}"
          SHA=$(git rev-parse HEAD)

          # GITHUB_TOKEN 으로 만든 push 는 push 이벤트를 발생시키지 않는다.
          # 그래서 배포 워크플로우를 직접 실행해 준다.
          gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}"

          {
            echo "## 설교 영상을 반영하고 배포를 시작했습니다"
            echo ""
            echo "| 언어 | Embed URL |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          for entry in $CHANGED; do
            lang="${entry%%:*}"
            url="${entry#*:}"
            case "$lang" in
              ko) label="한국어" ;;
              ja) label="일본어" ;;
              *)  label="$lang" ;;
            esac
            echo "| ${label} | ${url} |" >> "$GITHUB_STEP_SUMMARY"
          done

          {
            echo ""
            echo "커밋: [\`${SHA:0:7}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${SHA}) (\`${GITHUB_REF_NAME}\`)"
            echo ""
            echo "배포 진행 상황은 [Deploy to GitHub Pages](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml) 에서 확인할 수 있습니다."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::notice::${GITHUB_REF_NAME} 에 커밋 완료 (${SHA:0:7}) — 배포를 시작했습니다."

      - name: Report no-op
        if: steps.replace.outputs.has_changes != 'true'
        env:
          SKIPPED: ${{ steps.replace.outputs.skipped }}
        run: |
          {
            echo "## 변경 사항이 없어 아무것도 반영하지 않았습니다"
            echo ""
            echo "| 언어 | 사유 | 현재 Embed URL |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          REASONS=""
          for entry in $SKIPPED; do
            lang="${entry%%:*}"
            url="${entry#*:}"
            case "$lang" in
              ko) label="한국어" ;;
              ja) label="일본어" ;;
              *)  label="$lang" ;;
            esac
            echo "| ${label} | 입력한 URL 이 현재 설정된 URL 과 동일합니다 | ${url} |" >> "$GITHUB_STEP_SUMMARY"
            REASONS="${REASONS}${REASONS:+, }${label}: 입력한 URL 이 현재 설정된 URL 과 동일합니다 (${url})"
          done

          {
            echo ""
            echo "새로 올라온 영상의 링크를 입력했는지 확인해 주세요."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::warning::반영한 변경 사항이 없습니다 — ${REASONS:-변경된 영상 링크가 없습니다}"
